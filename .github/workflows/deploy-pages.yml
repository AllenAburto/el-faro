name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias del pipeline de datos (Plan de Trabajo Fase 2)
        run: pip install -r seguimiento-modulos/scripts/requirements.txt
      - name: Regenerar js/app-data.js desde el Excel maestro
        run: python3 seguimiento-modulos/scripts/extract.py
      - name: Validar datos extraídos (falla el build si hay errores)
        run: python3 seguimiento-modulos/scripts/validate.py
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
